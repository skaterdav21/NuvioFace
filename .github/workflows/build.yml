name: Nuvio Face
# Every day: take the latest official Nuvio (phone) and NuvioTV releases, apply the Nuvio Face patches,
# build phone, TV and updater APKs, and publish one GitHub Release. Skips when nothing changed.
#
# Secrets (Settings > Secrets and variables > Actions):
#   NUVIO_FACE_KEYSTORE_B64   signing key (PKCS12, password + alias "nuvioface"). Needed for updates to install over each other.
#   TMDB_API_KEY, TRAKT_CLIENT_ID, TRAKT_CLIENT_SECRET, SIMKL_CLIENT_ID, MDBLIST_CLIENT_ID, PREMIUMIZE_CLIENT_ID,
#   INTRODB_API_URL, IMDB_RATINGS_API_BASE_URL, IMDB_TAPFRAME_API_BASE_URL, PARENTAL_GUIDE_API_URL, TRAILER_API_URL:
#   optional API keys; each feature that needs one is off without it.

on:
  schedule:
    - cron: "23 11 * * *"   # 3:23 AM Pacific
  push:
    branches: [main]
    paths: ["patches/**", "scripts/**", "updater/**", ".github/workflows/build.yml"]
  workflow_dispatch:
    inputs:
      phone_ref:
        description: "Official Nuvio (phone) tag/branch/commit (blank = latest release)"
        default: ""
      tv_ref:
        description: "Official NuvioTV tag/branch/commit (blank = latest release)"
        default: ""
      force:
        description: "Build even if this release already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nuvio-face
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      phone_ref: ${{ steps.p.outputs.phone_ref }}
      phone_sha: ${{ steps.p.outputs.phone_sha }}
      tv_ref: ${{ steps.p.outputs.tv_ref }}
      tv_sha: ${{ steps.p.outputs.tv_sha }}
      tag: ${{ steps.p.outputs.tag }}
      skip: ${{ steps.p.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
      - id: p
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PHONE_IN: ${{ github.event.inputs.phone_ref }}
          TV_IN: ${{ github.event.inputs.tv_ref }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          resolve() { # url ref -> sha
            local sha
            sha=$(git ls-remote "$1" "refs/tags/$2^{}" | cut -f1)
            [ -n "$sha" ] || sha=$(git ls-remote "$1" "refs/tags/$2" "refs/heads/$2" | head -n1 | cut -f1)
            [ -n "$sha" ] || sha="$2"
            echo "$sha"
          }
          pick() { # url input -> ref
            if [ -n "$2" ]; then echo "$2"; else python3 scripts/latest-tag.py "$1"; fi
          }
          PHONE=https://github.com/NuvioMedia/NuvioMobile.git
          TV=https://github.com/NuvioMedia/NuvioTV.git
          phone_ref=$(pick $PHONE "$PHONE_IN"); tv_ref=$(pick $TV "$TV_IN")
          phone_sha=$(resolve $PHONE "$phone_ref"); tv_sha=$(resolve $TV "$tv_ref")
          ph=$(cat patches/*.patch scripts/*.sh | sha256sum | cut -c1-8)
          tag="face-${phone_ref}-tv-${tv_ref}-p${ph}"
          echo "Phone: $phone_ref ($phone_sha)  TV: $tv_ref ($tv_sha)  release: $tag"
          skip=false
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then skip=true; echo "Already built."; fi
          {
            echo "phone_ref=$phone_ref"; echo "phone_sha=$phone_sha"
            echo "tv_ref=$tv_ref"; echo "tv_sha=$tv_sha"
            echo "tag=$tag"; echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

  phone:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with: { path: face }
      - name: Official Nuvio + Nuvio Face patch
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioMobile.git upstream
          cd upstream
          git -c advice.detachedHead=false checkout -q "${{ needs.plan.outputs.phone_sha }}"
          ../face/scripts/apply-patch.sh ../face/patches/nuvio-face.patch
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - name: Properties, version, identity
        id: v
        shell: bash
        working-directory: upstream
        env:
          NUVIO_FACE_KEYSTORE_B64: ${{ secrets.NUVIO_FACE_KEYSTORE_B64 }}
          NUVIO_AUTO_KEYSTORE_B64: ${{ secrets.NUVIO_AUTO_KEYSTORE_B64 }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          PARENTAL_GUIDE_API_URL: ${{ secrets.PARENTAL_GUIDE_API_URL }}
          TRAILER_API_URL: ${{ secrets.TRAILER_API_URL }}
        run: |
          ../face/scripts/write-properties.sh "$RUNNER_TEMP/nuvio-face.jks"
          vfile=iosApp/Configuration/Version.xcconfig
          up_name=$(grep -E '^MARKETING_VERSION=' "$vfile" | cut -d= -f2 | tr -d ' ')
          up_code=$(grep -E '^CURRENT_PROJECT_VERSION=' "$vfile" | cut -d= -f2 | tr -d ' ')
          name="${up_name}-face.${GITHUB_RUN_NUMBER}"; code=$(( up_code * 10000 + GITHUB_RUN_NUMBER ))
          sed -i "s/^MARKETING_VERSION=.*/MARKETING_VERSION=${name}/;s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=${code}/" "$vfile"
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"
          f=androidApp/src/main/res/values/car_strings.xml
          sed -i 's|<string name="app_name">Nuvio Auto</string>|<string name="app_name">Nuvio Face</string>|;s|<string name="car_app_label">Nuvio</string>|<string name="car_app_label">Nuvio Face</string>|;s|<string name="car_setup_label">Nuvio Auto Setup</string>|<string name="car_setup_label">Nuvio Face Setup</string>|' "$f"
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/;s/^kotlin.daemon.jvmargs=.*/kotlin.daemon.jvmargs=-Xmx3g/' gradle.properties
      - name: Build
        working-directory: upstream
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Pnuvio.applicationId=com.dave.nuvioface --stacktrace
      - name: Collect
        shell: bash
        run: |
          d=upstream/androidApp/build/outputs/apk/full/release; mkdir -p out; n="${{ steps.v.outputs.name }}"
          cp "$(ls $d/*arm64-v8a*.apk | head -n1)" "out/NuvioFace-$n-arm64.apk"
          cp "$(ls $d/*armeabi-v7a*.apk | head -n1)" "out/NuvioFace-$n-arm32.apk"
      - uses: actions/upload-artifact@v7
        with: { name: phone, path: out/*.apk, retention-days: 3 }

  tv:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with: { path: face }
      - name: Official NuvioTV + Nuvio Face TV patch
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NuvioMedia/NuvioTV.git upstream
          cd upstream
          git -c advice.detachedHead=false checkout -q "${{ needs.plan.outputs.tv_sha }}"
          ../face/scripts/apply-patch.sh ../face/patches/nuvio-face-tv.patch
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v6
      - name: Properties, version, prebuilts
        id: v
        shell: bash
        working-directory: upstream
        env:
          NUVIO_FACE_KEYSTORE_B64: ${{ secrets.NUVIO_FACE_KEYSTORE_B64 }}
          NUVIO_AUTO_KEYSTORE_B64: ${{ secrets.NUVIO_AUTO_KEYSTORE_B64 }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          PARENTAL_GUIDE_API_URL: ${{ secrets.PARENTAL_GUIDE_API_URL }}
          TRAILER_API_URL: ${{ secrets.TRAILER_API_URL }}
        run: |
          ../face/scripts/write-properties.sh "$RUNNER_TEMP/nuvio-face.jks"
          up_name=$(grep -E '^\s*versionName = "' app/build.gradle.kts | head -n1 | sed -E 's/.*"(.*)".*/\1/')
          up_code=$(grep -E '^\s*versionCode = [0-9]+' app/build.gradle.kts | head -n1 | grep -oE '[0-9]+')
          name="${up_name}-face.${GITHUB_RUN_NUMBER}"; code=$(( up_code * 10000 + GITHUB_RUN_NUMBER ))
          sed -i -E "0,/^(\s*)versionCode = [0-9]+/s//\1versionCode = ${code}/" app/build.gradle.kts
          sed -i -E "0,/^(\s*)versionName = \".*\"/s//\1versionName = \"${name}\"/" app/build.gradle.kts
          grep -nE 'versionCode|versionName|applicationId = ' app/build.gradle.kts | head -5
          echo "name=$name" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -f native/usenet/scripts/fetch_prebuilts.py ]; then python3 native/usenet/scripts/fetch_prebuilts.py; fi
      - name: Build
        working-directory: upstream
        run: ./gradlew :app:assembleFullRelease --stacktrace
      - name: Collect
        shell: bash
        run: |
          d=upstream/app/build/outputs/apk/full/release; ls -la $d; mkdir -p out; n="${{ steps.v.outputs.name }}"
          cp "$(ls $d/*arm64-v8a*.apk | head -n1)" "out/NuvioFaceTV-$n-arm64.apk"
          cp "$(ls $d/*armeabi-v7a*.apk | head -n1)" "out/NuvioFaceTV-$n-arm32.apk"
      - uses: actions/upload-artifact@v7
        with: { name: tv, path: out/*.apk, retention-days: 3 }

  publish:
    needs: [plan, phone, tv]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with: { path: face }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/download-artifact@v7
        with: { path: out, merge-multiple: true }
      - name: Signing key
        shell: bash
        env:
          NUVIO_FACE_KEYSTORE_B64: ${{ secrets.NUVIO_FACE_KEYSTORE_B64 }}
          NUVIO_AUTO_KEYSTORE_B64: ${{ secrets.NUVIO_AUTO_KEYSTORE_B64 }}
        run: |
          mkdir -p /tmp/k && cd /tmp/k && "$GITHUB_WORKSPACE/face/scripts/write-properties.sh" "$RUNNER_TEMP/nuvio-face.jks" > /dev/null
      - name: Build the updater
        working-directory: face/updater
        run: >
          ./gradlew --no-daemon :app:assembleRelease
          -Pupdater.versionCode=${{ github.run_number }} -Pupdater.versionName=1.${{ github.run_number }}
          -Pupdater.storeFile=${{ env.KEYSTORE }} -Pupdater.storePassword=${{ env.KEYPASS }} -Pupdater.keyAlias=${{ env.KEYALIAS }}
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls face/updater/app/build/outputs/apk/release/*.apk | head -n1)" out/NuvioFaceUpdater.apk
          ls -la out
          tag="${{ needs.plan.outputs.tag }}"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && tag="${tag}-r${GITHUB_RUN_NUMBER}"
          {
            echo "Nuvio Face on official Nuvio **${{ needs.plan.outputs.phone_ref }}** and NuvioTV **${{ needs.plan.outputs.tv_ref }}**."
            echo
            echo "- **NuvioFace-...-arm64.apk**: phones (S25+)"
            echo "- **NuvioFaceTV-...-arm64.apk**: Nvidia Shield"
            echo "- **NuvioFaceTV-...-arm32.apk**: Chromecast with Google TV, onn 4K boxes"
            echo "- **NuvioFaceUpdater.apk**: install once per device; it installs and updates the right app"
            echo
            echo "versionName: ${{ needs.phone.outputs.name }}"
            echo "versionCode: ${{ needs.phone.outputs.code }}"
            echo "tvVersionName: ${{ needs.tv.outputs.name }}"
            echo "tvVersionCode: ${{ needs.tv.outputs.code }}"
          } > notes.md
          gh release create "$tag" out/*.apk -R "$GITHUB_REPOSITORY" --title "Nuvio Face ${{ needs.phone.outputs.name }} / TV ${{ needs.tv.outputs.name }}" --notes-file notes.md --latest
